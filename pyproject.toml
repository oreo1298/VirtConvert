[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertconvert"
dynamic = ["version"]
description = "Convert and create virtual disks for VirtualBox, Hyper-V, VMware and QEMU/KVM: VDI, VMDK, VHD, VHDX, QCOW2, OVA and more"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "VertConvert&Create contributors" }]
keywords = ["vhd", "vhdx", "vdi", "vmdk", "virtualbox", "hyper-v", "disk image", "converter",
            "qemu-img", "avhdx", "checkpoint", "snapshot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
    "Topic :: Utilities",
]
# The core and the command line use only the standard library (and qemu-img).
# The app needs PySide6: from your distribution, or the "gui" extra.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
test = ["pytest>=7"]
dev = ["pytest>=7", "PySide6-Essentials>=6.5", "ruff"]

[project.scripts]
vertconvert = "vertconvert.cli:main"

[project.urls]
Homepage = "https://github.com/oreo1298/VirtConvert"
Repository = "https://github.com/oreo1298/VirtConvert"
Issues = "https://github.com/oreo1298/VirtConvert/issues"

[tool.setuptools]
packages = ["vertconvert", "vertconvert.core", "vertconvert.data", "vertconvert.gui"]

[tool.setuptools.dynamic]
version = { attr = "vertconvert.__version__" }

[tool.setuptools.package-data]
"vertconvert.data" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "qemu: needs qemu-img",
    "gui: needs PySide6",
    "vbox: compares with VirtualBox (VBoxManage)",
    "libvhdi: compares with libvhdi (pyvhdi)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 long lines, E741 ambiguous names
ignore = ["E501", "E741"]
