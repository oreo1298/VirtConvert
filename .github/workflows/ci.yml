name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: qemu-img and Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Command-line smoke test
        run: |
          vertconvert --version && vertconvert --help > /dev/null
          vertconvert formats
          vertconvert doctor

  references:
    # compare with independent implementations: VirtualBox and libvhdi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: VirtualBox, libvhdi and qemu-img
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils virtualbox python3-libvhdi python3-pytest
      - name: Tests against VirtualBox and libvhdi
        run: python3 -m pytest -q -rs -m "vbox or libvhdi" tests/test_references.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check vertconvert tests tools
      - name: Shell scripts
        run: |
          for f in packaging/install.sh packaging/update.sh packaging/uninstall.sh vertconvert.sh \
                   tools/installer-smoke.sh; do bash -n "$f"; done
      - name: Desktop entry and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate data/io.github.oreo1298.VertConvertCreate.desktop
          appstreamcli validate --no-net --pedantic data/io.github.oreo1298.VertConvertCreate.metainfo.xml || \
            appstreamcli validate --no-net data/io.github.oreo1298.VertConvertCreate.metainfo.xml

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Build, install, rebuild and remove the Arch package
        run: |
          pacman -Syu --noconfirm --needed git python pyside6 qt6-svg qt6-wayland qemu-img \
            python-build python-installer python-setuptools python-wheel python-pytest
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --noconfirm"
          pacman -U --noconfirm "$GITHUB_WORKSPACE"/vertconvert-*.pkg.tar.zst
          vertconvert --version
          vertconvert doctor
          test -f /usr/share/applications/io.github.oreo1298.VertConvertCreate.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.oreo1298.VertConvertCreate.svg
          QT_QPA_PLATFORM=offscreen python -c "import vertconvert.gui.main_window; print('import OK')"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -f --noconfirm"
          pacman -U --noconfirm "$GITHUB_WORKSPACE"/vertconvert-*.pkg.tar.zst
          pacman -Rns --noconfirm vertconvert
          test ! -e /usr/bin/vertconvert

  installer:
    # packaging/install.sh, update.sh and uninstall.sh on other distributions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
          - image: ubuntu:22.04
          - image: debian:12
          - image: debian:13
          - image: fedora:latest
          - image: opensuse/tumbleweed
          - image: rockylinux:9
          - image: opensuse/leap:15.6
            experimental: true
          - image: alpine:latest
            experimental: true
          - image: ghcr.io/void-linux/void-glibc-full:latest
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v5
      - name: Install, convert, update and uninstall on ${{ matrix.image }}
        run: |
          docker run --rm -e REQUIRE_GUI=${{ matrix.gui || '1' }} -v "$PWD:/src:ro" ${{ matrix.image }} \
            sh -c 'command -v bash >/dev/null || (command -v apk >/dev/null && apk add --no-cache bash) || \
                   (command -v xbps-install >/dev/null && xbps-install -Sy bash); exec bash /src/tools/installer-smoke.sh'
